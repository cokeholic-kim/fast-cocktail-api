version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cocktail-postgres
    environment:
      POSTGRES_DB: cocktail_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./fastapi-app
    container_name: cocktail-backend-fastapi
    env_file:
      - ./fastapi-app/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/cocktail_db
    depends_on:
      - db
    ports:
      - "8080:8080"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]

volumes:
  postgres_data:
